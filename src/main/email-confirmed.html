
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Market Intelligence | Email Confirmation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            color: #ebebeb;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 440px;
            padding: 45px 35px;
            text-align: center;
            background: #181818;
            border: 1px solid #373737;
            border-radius: 12px;
        }

        .logo {
            color: #00c878;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 15px;
        }

        p {
            color: #999;
            font-size: 15px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin: 15px 0;
            padding: 8px 16px;
            color: #00c878;
            border: 1px solid #00c878;
            border-radius: 20px;
            font-size: 13px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">MI</div>

        <h1>Email Confirmed!</h1>

        <div class="status">Verification successful</div>

        <p>
            Your email has been successfully verified.
            Your Market Intelligence account is ready.
        </p>

        <p>
            You can now return to the desktop application
            and log in.
        </p>

        <div class="footer">
            Market Intelligence · Read. Predict. Act.
        </div>

    </div>

</body>
</html>
